<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <title>Consultor de Dietas</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        margin: 0;
        background-image: url(imagens/Daily\ Energy\ Home\ \(1\)_page-0001.jpg);
        background-size: 75%;
        background-color: #2a4553;
        color: white;
        font-family: 'Georgia', serif;
      }

      .main-content {
        margin-left: 0;
        padding: 20px;
        transition: margin-left 0.3s;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        text-shadow:
          -1px -1px 0 black,
          1px -1px 0 black,
          -1px 1px 0 black,
          1px 1px 0 black;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #444;
        padding: 8px;
        text-align: center;
      }

      th {
        background-color: #333;
      }

      tr:nth-child(even) {
        background-color: #1e1e1e;
      }

      tr:nth-child(odd) {
        background-color: #2c2c2c;
      }

      input[type="number"] {
        padding: 10px;
        font-size: 16px;
        width: 90%;
        margin: 0 auto;
        margin-bottom: 10px;
        background-color: #333;
        border: 1px solid #555;
        color: white;
        display: block;
      }

      input[type="button"] {
        padding: 10px;
        font-size: 16px;
        width: 50%;
        margin: 0 auto;
        background-color: #333;
        border: 1px solid #555;
        color: white;
        display: block;
      }

      #resultado {
        margin-top: 20px;
        text-align: center;
      }

      #resultado p {
        font-size: 20px;
      }

      .dietas-sugestao {
        background-color: #333;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
      }

      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        background-color: #2a4553;
      }

      .active-link {
        background-color: #1c2f38;
        color: white;
      }

      li a:hover {
        background-color: #2a4553;
        color: #ffffff;
      }

      li a {
        display: block;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 20px;
        text-decoration: none;
        font-size: 18px;
        transition: background-color 0.3s;
      }
    </style>

  </head>

  <body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <ul>
        <a href="#" class="closebtn" onclick="toggleMenu()">×</a>
        <li>
          <a href="home.html"><img src="imagens/home.png" class="icon"></i> HOME</a>
        </li>
        <li>
          <a href="https://www.instagram.com/dailyenergyoficial/"><img src="imagens/insta.png" class="icon"></i>
            INSTAGRAM</a>
        </li>
        <li>
          <a href="calculadora.html"><img src="imagens/calculador.png" class="icon"></i> CALCULADORA IMC</a>
        </li>
        <li>
          <a href="tabela.html"><img src="imagens/table.png" class="icon"></i> TABELA NUTRICIONAL</a>
        </li>
        <li class="active-link">
          <a href="dieta.html"><img src="imagens/garfo.png" class="icon"></i> DIETAS</a>
        </li>
        <li>
          <a href="#"><img src="imagens/perfil.png" class="icon"></i> PERFIL</a>
        </li>
        <li>
          <a href="#"><img src="imagens/registro.png" class="icon"></i> REGISTRO</a>
        </li>
      </ul>
    </div>

    <!-- Conteúdo principal -->
    <div class="main-content">
      <span class="menu-btn" onclick="toggleMenu()">☰</span>

      <!-- Formulário de IMC -->
      <h1>Consultor de Dietas</h1>

      <div class="calculadora">
        <h2 style="text-align: center;">Informe seu IMC</h2>

        <div class="input-group">
          <input type="number" id="imc" step="0.1" placeholder="Ex: 23.5">
        </div>

        <input type="button" value="Ver Dieta" onclick="sugerirDieta()">

        <div id="resultado"></div>
      </div>
    </div>

    <script>
      function sugerirDieta() {
        const imcValor = parseFloat(document.getElementById("imc").value);
        const resultadoDiv = document.getElementById("resultado");

        if (isNaN(imcValor) || imcValor <= 0) {
          resultadoDiv.innerHTML = "Por favor, insira um valor válido de IMC!";
          return;
        }

        let dieta = '';

        if (imcValor < 18.5) {
          dieta = 'Dieta recomendada: Dieta hipercalórica rica em proteínas e carboidratos.';
        } else if (imcValor >= 18.5 && imcValor < 24.9) {
          dieta = 'Dieta recomendada: Manutenção da alimentação balanceada com todos os nutrientes.';
        } else if (imcValor >= 25 && imcValor < 29.9) {
          dieta = 'Dieta recomendada: Dieta para perda de peso com baixo teor calórico e rica em fibras.';
        } else {
          dieta = 'Dieta recomendada: Dieta de baixo carboidrato e baixa gordura, com acompanhamento médico.';
        }

        resultadoDiv.innerHTML = `<p>Com base no seu IMC de ${imcValor.toFixed(2)}, a recomendação é:</p><p><strong>${dieta}</strong></p>`;
      }
    </script>
    <script src="script.js"></script>
  </body>

</html>
